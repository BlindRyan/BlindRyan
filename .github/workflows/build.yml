name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows plugin (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/RhinoAudioRouter.clap dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: RhinoAudioRouter-windows-x64
          path: dist/

  linux:
    name: Tests and MinGW cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 ninja-build
      - name: Unit tests
        run: |
          cmake -S . -B build-tests -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure
      - name: Cross-compile the plugin
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAAB_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          cmake --build build-win
